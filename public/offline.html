<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      name="theme-color"
      content="#a8441b"
    />
    <title>Offline | Puja Dham</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff7ed;
        color: #3b1f0e;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      main {
        width: min(100%, 440px);
        padding: 32px 24px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #fed7aa;
        border-radius: 24px;
        box-shadow:
          0 20px 60px
          rgba(59, 31, 14, 0.14);
      }

      img {
        width: 84px;
        height: 84px;
        object-fit: contain;
        border-radius: 20px;
      }

      h1 {
        margin: 18px 0 10px;
        font-size: 28px;
        color: #9a3412;
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: #6b3a1e;
      }

      button {
        width: 100%;
        min-height: 46px;
        margin-top: 24px;
        border: 0;
        border-radius: 14px;
        background: #a8441b;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>

  <body>
    <main>
      <img
        src="/icons/icon-192.png"
        alt="Puja Dham"
        width="84"
        height="84"
      />

      <h1>You are offline</h1>

      <p>
        Internet Connection Error.
        Connection aane ke baad page dobara reload karein.
      </p>

      <button
        type="button"
        onclick="window.location.reload()"
      >
        Try Again
      </button>
    </main>
  </body>
</html>
